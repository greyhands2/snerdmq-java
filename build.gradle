plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.greyhands2'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'snerdmq'
            
            pom {
                name = 'SnerdMQ Java SDK'
                description = 'A zero-config, C-speed background job queue for the JVM. Ditch Redis for an embedded Rust daemon.'
                url = 'https://github.com/greyhands2/snerdmq-java'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                    }
                }
                
                developers {
                    developer {
                        id = 'greyhands2'
                        name = 'Greyhands2'
                        email = 'developer@example.com' // Replace with your actual email
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/greyhands2/snerdmq-java.git'
                    developerConnection = 'scm:git:ssh://github.com/greyhands2/snerdmq-java.git'
                    url = 'https://github.com/greyhands2/snerdmq-java'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "OSSRH"
            def releasesRepoUrl = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            
            credentials {
                // These will be securely loaded from your ~/.gradle/gradle.properties file
                username = project.findProperty("ossrhUsername")
                password = project.findProperty("ossrhPassword")
            }
        }
    }
}

signing {
    // This looks for signing.keyId, signing.password, and signing.secretKeyRingFile in ~/.gradle/gradle.properties
    sign publishing.publications.mavenJava
}
